name: Build and Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev dpkg-dev
      - name: Build project
        run: |
          gcc -c alwex_runtime.c -o alwex_runtime.o
          gcc alwex_compiler.c -o alwex_compiler
      - name: Prepare .deb package
        run: |
          mkdir -p pkg/usr/bin pkg/DEBIAN
          cp alwex_compiler pkg/usr/bin/alwex_compiler
          cp alwex_runtime.o pkg/usr/bin/alwex_runtime.o
          cat > pkg/DEBIAN/control << 'EOF'
          Package: alwex-compiler
          Version: 1.0.0
          Section: devel
          Priority: optional
          Architecture: amd64
          Depends: libc6, libcurl4, gcc
          Maintainer: Alwex Developer <alwextt@gmail.com>
          Description: AlwexScript compiler
          EOF
          dpkg-deb --build pkg alwex-compiler.deb
      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: alwex-compiler.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl

      - name: Build and prepare package
        shell: msys2 {0}
        run: |
          # Собираем компилятор Alwex
          gcc -c alwex_runtime.c -o alwex_runtime.o
          gcc alwex_compiler.c -o alwex_compiler.exe -lwininet

          # Создаём пакет (все файлы в корне)
          mkdir -p windows_pkg
          cp alwex_compiler.exe windows_pkg/
          cp alwex_runtime.o windows_pkg/

          # Находим папку с GCC
          GCC_BIN=$(dirname $(which gcc))
          echo "GCC bin directory: $GCC_BIN"

          # Копируем gcc.exe и минимальный набор утилит
          for tool in gcc as ld cc1 collect2; do
            if [ -f "$GCC_BIN/$tool.exe" ]; then
              cp "$GCC_BIN/$tool.exe" windows_pkg/
            fi
          done

          # Копируем все DLL, которые могут понадобиться
          cp $GCC_BIN/*.dll windows_pkg/ 2>/dev/null || true

          # Проверяем, что gcc.exe на месте
          if [ -f windows_pkg/gcc.exe ]; then
            echo "gcc.exe successfully placed in package root"
          else
            echo "ERROR: gcc.exe not found"
            exit 1
          fi

      - name: Create archive (PowerShell)
        shell: pwsh
        run: |
          if (-not (Test-Path "windows_pkg\gcc.exe")) {
              Write-Error "gcc.exe not found in package root"
              exit 1
          }
          Compress-Archive -Path "windows_pkg\*" -DestinationPath "alwex-compiler-windows.zip" -Force

      - name: Upload Windows archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: alwex-compiler-windows.zip
