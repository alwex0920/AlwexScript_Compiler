name: Build and Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev dpkg-dev
      - name: Build project
        run: |
          gcc -c alwex_runtime.c -o alwex_runtime.o
          gcc alwex_compiler.c -o alwex_compiler
      - name: Prepare .deb package
        run: |
          mkdir -p pkg/usr/bin pkg/DEBIAN
          cp alwex_compiler pkg/usr/bin/alwex_compiler
          cp alwex_runtime.o pkg/usr/bin/alwex_runtime.o
          cat > pkg/DEBIAN/control << 'EOF'
          Package: alwex-compiler
          Version: 1.0.0
          Section: devel
          Priority: optional
          Architecture: amd64
          Depends: libc6, libcurl4, gcc
          Maintainer: Alwex Developer <alwextt@gmail.com>
          Description: AlwexScript compiler
          EOF
          dpkg-deb --build pkg alwex-compiler.deb
      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: alwex-compiler.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl

      - name: Build project
        shell: msys2 {0}
        run: |
          gcc -c alwex_runtime.c -o alwex_runtime.o
          gcc alwex_compiler.c -o alwex_compiler.exe -lwininet

      - name: Prepare Windows package (with portable GCC)
        shell: pwsh
        run: |
          $pkg = "windows_pkg"
          New-Item -ItemType Directory -Force -Path $pkg

          # Копируем сам компилятор
          Copy-Item -Path "alwex_compiler.exe" -Destination $pkg\
          Copy-Item -Path "alwex_runtime.o" -Destination $pkg\

          $mingwRoot = "C:\msys64\mingw64"
          Write-Host "Listing $mingwRoot\bin (первые 20 файлов):"
          Get-ChildItem "$mingwRoot\bin" -File | Select-Object -First 20 | ForEach-Object { Write-Host $_.Name }

          # Убедимся, что gcc.exe существует
          $gccExe = "$mingwRoot\bin\gcc.exe"
          if (-not (Test-Path $gccExe)) {
              Write-Error "gcc.exe not found in $mingwRoot\bin"
              exit 1
          }

          # Создаём папку gcc/bin внутри пакета
          New-Item -ItemType Directory -Force -Path "$pkg\gcc\bin"

          Write-Host "Copying GCC tools..."
          Copy-Item -Path "$gccExe" -Destination "$pkg\gcc\bin\"

          # Копируем минимально необходимые утилиты
          $tools = @("as.exe", "ld.exe", "cc1.exe", "collect2.exe")
          foreach ($tool in $tools) {
              $src = "$mingwRoot\bin\$tool"
              if (Test-Path $src) {
                  Copy-Item -Path $src -Destination "$pkg\gcc\bin\"
              }
          }

          # Копируем нужные библиотеки
          $libs = @("libgcc_s_seh-1.dll", "libwinpthread-1.dll", "libstdc++-6.dll", "libgmp-10.dll", "libmpfr-6.dll", "libmpc-3.dll", "libisl-23.dll", "zlib1.dll")
          foreach ($lib in $libs) {
              $src = "$mingwRoot\bin\$lib"
              if (Test-Path $src) {
                  Copy-Item -Path $src -Destination "$pkg\gcc\bin\"
              }
          }

          # Проверяем, что gcc.exe скопировался
          if (-not (Test-Path "$pkg\gcc\bin\gcc.exe")) {
              Write-Error "gcc.exe not found in package after copy!"
              exit 1
          }

          Write-Host "Creating archive..."
          Compress-Archive -Path "$pkg\*" -DestinationPath "alwex-compiler-windows.zip" -Force

      - name: Upload Windows archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: alwex-compiler-windows.zip
